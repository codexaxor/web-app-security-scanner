# One command to run everything (M0 "Done when"). Config comes from .env (see .env.example).
# `docker compose up` runs postgres + api + worker + ui. For day-to-day dev, prefer ./gradlew bootRun
# and `npm run dev` (see README).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secscan}
      POSTGRES_USER: ${POSTGRES_USER:-secscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secscan}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secscan} -d ${POSTGRES_DB:-secscan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: api
      SECSCAN_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-secscan}
      SECSCAN_DB_USER: ${POSTGRES_USER:-secscan}
      SECSCAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-secscan}
      SECSCAN_ENCRYPTION_KEY: ${SECSCAN_ENCRYPTION_KEY:-}
      SECSCAN_BOOTSTRAP_ADMIN_EMAIL: ${SECSCAN_BOOTSTRAP_ADMIN_EMAIL:-}
      SECSCAN_BOOTSTRAP_ADMIN_PASSWORD: ${SECSCAN_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SECSCAN_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-secscan}
      SECSCAN_DB_USER: ${POSTGRES_USER:-secscan}
      SECSCAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-secscan}
      SECSCAN_ENCRYPTION_KEY: ${SECSCAN_ENCRYPTION_KEY:-}
      SECSCAN_WORKER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
