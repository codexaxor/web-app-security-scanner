server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The OD-13c headers are for the HTML document responses. nginx's add_header does NOT inherit into a
    # location that defines its own add_header, so the snippet is `include`d into EVERY document location
    # (change 4): /, the SPA fallback, index.html and the hashed assets (incl. their 404s). It is deliberately
    # NOT added on /api/ — Spring Security already sets X-Content-Type-Options: nosniff on API responses, and
    # re-adding it here would duplicate the header.

    # Long-cache the content-hashed build assets (and their 404s carry the header set too).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA shell must never be cached (OD-13c: Cache-Control no-store on index.html).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # SPA routes fall back to index.html (a deep link like /feed/x serves the shell, with no-store).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # Forward API calls to the api service on the compose network. Same-origin from the browser's view.
    # Spring Security supplies X-Content-Type-Options: nosniff (and omits WWW-Authenticate on the JSON 401).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # D-098: OVERWRITE (never append) X-Forwarded-For with the direct peer, so a client-supplied header can
        # never reach the api; the api trusts this header only from this nginx's pinned address (SECSCAN_TRUSTED_PROXIES).
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
