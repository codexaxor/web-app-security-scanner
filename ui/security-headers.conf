# OD-13c security headers (M8). `always` so they are emitted on error responses (4xx/5xx) too. nginx's
# add_header does NOT inherit into a location that defines its own add_header, so this snippet is `include`d
# into EVERY location (change 4) — the server-level include only covers responses that match no location.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
