# Curated duplicate-SAST-rule map (D-061): {LOSER opengrep-rules rule id} = {WINNER rule id}.
# When BOTH fire for the same file_path in the same scan, the LOSER is auto-ignored as DUPLICATE_RULE and the
# WINNER stays open. No cross-rule merge, no fingerprint change. The winner may be a custom rule OR a more
# framework/library-specific stock rule (M8.15 additions below).
#
# Every id here is captured from REAL Opengrep output, never guessed (D-061 / review change #5).
# SAFETY IS EMPIRICAL, NOT ENFORCED: the runtime matches PER FILE — D-061 ignores the loser whenever the winner
# fires ANYWHERE in the same file_path, never per line. For each M8.15 pair, same-line was CHECKED EMPIRICALLY on
# plexicus + PyGoat (every loser hit had the winner on the same line there); on another repo a loser-only line in
# a file where the winner fires elsewhere WOULD be ignored. Pairs that failed the empirical check were dropped (e.g. avoid-pickle -> flask.insecure-deserialization hid a distinct pickle bug at
# pygoat software_integrity_lab/app.py:19), as was sql-injection-db-cursor-execute (fires alone, no same-line
# winner). See docs/reports/M8.15.md and the deferred "django.* on non-Django code" note.
#
# Confirmed 2026-10-21: both ids below fired on the same CSRF-disabled file.
opengrep-rules.java.spring.security.audit.spring-csrf-disabled = opengrep-rules.custom.spring-csrf-disabled
#
# M8.15 (2026-11-10): framework/library-specific winner over a generic/wrong-framework loser. Captured from real
# production scans of plexicus/simplest-sast-vulnerable @77baa1b (Flask) and OWASP PyGoat @2aa4cc14 (Django);
# same-line checked empirically on plexicus + PyGoat; runtime matches per file (evidence in docs/reports/M8.15.md).
# A Flask app's SQLi: keep the Flask taint rule, drop Django's twin.
opengrep-rules.python.django.security.injection.tainted-sql-string = opengrep-rules.python.flask.security.injection.tainted-sql-string
# Same raw SQL execute: keep the SQLAlchemy-specific rule, drop the generic formatted-sql-query.
opengrep-rules.python.lang.security.audit.formatted-sql-query = opengrep-rules.python.sqlalchemy.security.sqlalchemy-execute-raw-query
# Flask template HTML injection: keep the Flask rule, drop Django's twin.
opengrep-rules.python.django.security.injection.raw-html-format = opengrep-rules.python.flask.security.injection.raw-html-format
